name: Deploy FastAPI (SSH rolling deploy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - name: VM1
            host_secret: VM1_PUBLIC_IP
            key_secret: SSH_PRIVATE_KEY_VM1
          - name: VM2
            host_secret: VM2_PUBLIC_IP
            key_secret: SSH_PRIVATE_KEY_VM2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to ${{ matrix.name }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: ubuntu
          key: ${{ secrets[matrix.key_secret] }}
          script: |
            set -e

            # Bootstrap: clone if /app doesn't exist or isn't a git repo
            if [ ! -d /app/.git ]; then
              echo "Initializing /app from git..."
              sudo rm -rf /app
              sudo git clone https://github.com/${{ github.repository }}.git /app
              sudo chown -R ubuntu:ubuntu /app
            fi

            cd /app
            git fetch origin main
            git reset --hard origin/main

            # Install system deps only if missing
            dpkg -s python3-venv python3-pip git &>/dev/null || \
              sudo apt-get install -y -q python3 python3-venv python3-pip git

            # Recreate venv if broken or missing
            if [ ! -x /app/venv/bin/python ]; then
              echo "Creating fresh venv..."
              sudo rm -rf /app/venv
              python3 -m venv /app/venv
            fi

            /app/venv/bin/python -m pip install --upgrade pip --quiet
            /app/venv/bin/pip install --no-cache-dir -r /app/backend/requirements.txt --quiet

            # Create systemd service if it doesn't exist yet
            if [ ! -f /etc/systemd/system/fastapi.service ]; then
              echo "Creating fastapi.service..."
              sudo tee /etc/systemd/system/fastapi.service > /dev/null <<'EOF'
            [Unit]
            Description=FastAPI Application
            After=network.target

            [Service]
            Type=simple
            User=ubuntu
            WorkingDirectory=/app/backend
            ExecStart=/app/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000
            Restart=always
            RestartSec=5
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target
            EOF
              sudo systemctl daemon-reload
              sudo systemctl enable fastapi
            fi

            sudo systemctl restart fastapi

            # Healthcheck: retry up to 10 times with 2s delay
            echo "Waiting for healthcheck on ${{ matrix.name }}..."
            for i in $(seq 1 10); do
              if curl -fsS http://127.0.0.1:8000/health; then
                echo "${{ matrix.name }} healthy ✓"
                exit 0
              fi
              echo "Attempt $i/10 failed, retrying in 2s..."
              sleep 2
            done

            echo "❌ Healthcheck failed after 10 attempts"
            sudo journalctl -u fastapi -n 200
            exit 1

      - name: Deployment finished
        if: success()
        run: echo "✅ Rolling deploy complete — both VMs healthy"