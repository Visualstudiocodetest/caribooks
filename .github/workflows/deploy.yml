name: Deploy FastAPI (SSH rolling deploy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to VM1
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM1_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_VM1 }}
          script: |
            set -e
            cd /app || exit 1
            sudo -u ubuntu git pull origin main || true
            sudo apt-get update && sudo apt-get install -y python3 python3-venv python3-pip git || true
            # Ensure venv is a valid virtualenv; recreate if missing or broken
            if [ -x /app/venv/bin/python ] && [ ! -d /app/venv/bin/python ]; then
              echo "Using existing venv"
            else
              echo "Creating fresh venv"
              sudo rm -rf /app/venv || true
              sudo -u ubuntu python3 -m venv /app/venv
              sudo chown -R ubuntu:ubuntu /app/venv || true
            fi
            sudo -u ubuntu /app/venv/bin/python -m pip install --upgrade pip
            sudo -u ubuntu /app/venv/bin/pip install --no-cache-dir -r requirements.txt
            sudo systemctl restart fastapi || true
            echo "Waiting for healthcheck..."
            attempts=0
            until [ $attempts -ge 10 ]; do
              if curl -fsS http://127.0.0.1:8000/health; then
                echo "VM1 healthy ✓"
                break
              fi
              attempts=$((attempts+1))
              sleep 2
            done
            if [ $attempts -ge 10 ]; then
              sudo journalctl -u fastapi -n 200
              exit 1
            fi

      - name: Deploy to VM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_VM2 }}
          script: |
            set -e
            cd /app || exit 1
            sudo -u ubuntu git pull origin main || true
            sudo apt-get update && sudo apt-get install -y python3 python3-venv python3-pip git || true
            # Ensure venv is a valid virtualenv; recreate if missing or broken
            if [ -x /app/venv/bin/python ] && [ ! -d /app/venv/bin/python ]; then
              echo "Using existing venv"
            else
              echo "Creating fresh venv"
              sudo rm -rf /app/venv || true
              sudo -u ubuntu python3 -m venv /app/venv
              sudo chown -R ubuntu:ubuntu /app/venv || true
            fi
            sudo -u ubuntu /app/venv/bin/python -m pip install --upgrade pip
            sudo -u ubuntu /app/venv/bin/pip install --no-cache-dir -r requirements.txt
            sudo systemctl restart fastapi || true
            echo "Waiting for healthcheck..."
            attempts=0
            until [ $attempts -ge 10 ]; do
              if curl -fsS http://127.0.0.1:8000/health; then
                echo "VM2 healthy ✓"
                break
              fi
              attempts=$((attempts+1))
              sleep 2
            done
            if [ $attempts -ge 10 ]; then
              sudo journalctl -u fastapi -n 200
              exit 1
            fi

      - name: Deployment finished
        run: echo "✅ Rolling deploy complete"
