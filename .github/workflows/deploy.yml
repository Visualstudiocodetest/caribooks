name: Deploy FastAPI (SSH rolling deploy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1   # rolling: deploy to VMs sequentially
      matrix:
        include:
          - name: VM1
            host_secret: VM1_PUBLIC_IP
            key_secret: SSH_PRIVATE_KEY_VM1
          - name: VM2
            host_secret: VM2_PUBLIC_IP
            key_secret: SSH_PRIVATE_KEY_VM2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to ${{ matrix.name }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: ubuntu
          key: ${{ secrets[matrix.key_secret] }}
          script: |
            set -e

            if [ ! -d /app/.git ]; then
              echo "Initializing /app from git..."
              sudo rm -rf /app
              sudo git clone https://github.com/${{ github.repository }}.git /app
              sudo chown -R ubuntu:ubuntu /app
            fi

            cd /app
            git fetch origin main
            git reset --hard origin/main

            dpkg -s python3-venv python3-pip git &>/dev/null || \
              sudo apt-get install -y -q python3 python3-venv python3-pip git

            if [ ! -x /app/venv/bin/python ]; then
              echo "Creating fresh venv..."
              sudo rm -rf /app/venv
              python3 -m venv /app/venv
            fi

            /app/venv/bin/python -m pip install --upgrade pip --quiet
            /app/venv/bin/pip install --no-cache-dir -r /app/backend/requirements.txt --quiet  # ← fixed path

            sudo systemctl restart fastapi

            echo "Waiting for healthcheck..."
            for i in $(seq 1 10); do
              if curl -fsS http://127.0.0.1:8000/health; then
                echo "${{ matrix.name }} healthy ✓"
                exit 0
              fi
              echo "Attempt $i/10 failed, retrying in 2s..."
              sleep 2
            done

            echo "❌ Healthcheck failed"
            sudo journalctl -u fastapi -n 200
            exit 1

      - name: Deployment finished
        if: success()
        run: echo "✅ Rolling deploy complete — both VMs healthy"